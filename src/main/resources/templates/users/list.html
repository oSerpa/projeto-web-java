<div th:replace="shared/top"  xmlns:th="http://www.w3.org/1999/xhtml"> </div>

                <!-- Begin Page Content -->
                <div class="container-fluid" xmlns:th="http://www.w3.org/1999/xhtml" >

                    <!-- Page Heading -->
                    <h1 class="h3 mb-2 text-gray-800">Usuários</h1>

                    <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>

                    <!-- DataTales Example -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Lista de usuários</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Nome</th>
                                            <th>Email</th>
                                            <th>Data de nascimento</th>
                                            <th>Telefone</th>
                                            <th>.</th>
                                            <th>.</th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        <tr th:each="user:${users}">
                                            <td th:text="${user.id}"></td>
                                            <td th:text="${user.name}"></td>
                                            <td th:text="${user.email}"></td>
                                            <td th:text="${#temporals.format(user.date, 'dd/MM/yyyy')}"></td>
                                            <td th:text="${user.tel}"></td>
                                            <td class="text-center"> <a th:href="@{'/usuarios/' + ${user.id} }" class="btn btn-warning">Alterar</a> </td>
                                            <td class="text-center">
                                                <form th:action="@{'/usuarios/delete/' + ${user.id} }" method="post" onsubmit="return confirm('Tem certeza que deseja apagar esse registro?')">
                                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

                </div>
            <!-- End of Main Content -->

<div th:replace="shared/bottom" xmlns:th="http://www.w3.org/1999/xhtml"> </div>
