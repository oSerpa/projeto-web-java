# Perfil de produção (usado no Render). Ative com SPRING_PROFILES_ACTIVE=prod.
# Banco PostgreSQL. Exemplo de DB_URL:
# jdbc:postgresql://ep-xxxx.sa-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Poucas conexões, porque o plano gratuito do banco tem limite
spring.datasource.hikari.maximum-pool-size=5

# O Render define a porta na variável PORT
server.port=${PORT:8080}
# O Render fica na frente com HTTPS; isso faz os redirects usarem https
server.forward-headers-strategy=framework

spring.h2.console.enabled=false
spring.thymeleaf.cache=true
