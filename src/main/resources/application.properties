# Banco de dados (MySQL). Os valores vêm de variáveis de ambiente;
# o que está depois dos dois pontos é o padrão usado se a variável não existir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/primeira_aplicacao_web}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Atualiza o schema do banco automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
