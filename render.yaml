# Blueprint do Render: cria o serviço web a partir do Dockerfile.
# As variáveis do banco são preenchidas no painel (sync: false).
services:
  - type: web
    name: crud-java
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
